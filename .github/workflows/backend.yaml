name: Backend CI/CD

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci-cd.yml'

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build backend Docker image
        run: docker build -t saksham123njn/moviebackend:${{ github.sha }} ./backend

      - name: Push backend Docker image
        run: docker push saksham123njn/moviebackend:${{ github.sha }}

      - name: Deploy to Kubernetes on EC2
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            sudo k3s kubectl set image deployment/backend-deployment backend=saksham123njn/moviebackend:${{ github.sha }}
            sudo k3s kubectl rollout status deployment/backend-deployment