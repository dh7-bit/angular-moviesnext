```yaml
name: Frontend CI/CD

on:
  push:
    branches:
      - main

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Docker image
        run: docker build -t saksham123njn/movieangular:${{ github.sha }} ./frontend/movie-explorer

      - name: Push Docker image
        run: docker push saksham123njn/movieangular:${{ github.sha }}

      - name: Deploy to Kubernetes on EC2
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            sudo k3s kubectl set image deployment/frontend frontend=saksham123njn/movieangular:${{ github.sha }}
            sudo k3s kubectl rollout status deployment/frontend
```
